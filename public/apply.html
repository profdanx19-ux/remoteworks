<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apply · RemoteStaff Hub</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-title="Apply · {name}">
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="index.html" data-site-name="{name}">RemoteStaff Hub</a>
      </div>
    </header>

    <main class="assessment">
      <div class="wrap assessment-card">
        <section id="unknown" hidden>
          <p class="eyebrow">Application</p>
          <h1>Choose a role first</h1>
          <p class="lede">Open a role from the jobs page and use Apply Now.</p>
          <a class="btn" href="index.html">Back to jobs</a>
        </section>

        <section id="apply" hidden>
          <p class="eyebrow" id="role-label"></p>
          <h1>Apply for this role</h1>
          <iframe
            id="application-form"
            class="form-frame"
            title="Application form"
            loading="lazy"
          ></iframe>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p data-site-name="{name}">RemoteStaff Hub</p>
      </div>
    </footer>

    <script src="site.config.js"></script>
    <script src="site.js"></script>
    <script src="apply.js"></script>
  </body>
</html>
